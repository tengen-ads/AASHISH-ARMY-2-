<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AADI BHAI </title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    text-align:center;
    padding:20px 15px;
}

.profile{
    width:250px;
    height:250px;
    border-radius:50%;
    object-fit:cover;
    margin:40px auto 30px;
    display:block;
}

.join-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    background:#ffd800;
    color:#111;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    padding:18px;
    border-radius:50px;
    width:100%;
    max-width:540px;
    margin:auto;
}

.join-btn img{
    width:24px;
}

.banner{
    background:#130000;
    color:white;
    margin:18px auto;
    padding:18px;
    font-size:22px;
    font-weight:bold;
    max-width:540px;
}

.banner span{
    color:#ffd800;
}

.timer{
    display:flex;
    justify-content:center;
    gap:25px;
    margin-top:20px;
    flex-wrap:wrap;
}

.box{
    text-align:center;
}

.number{
    color:#8b0020;
    font-size:42px;
    font-weight:bold;
}

.label{
    color:#8b0020;
    font-size:20px;
}

@media(max-width:600px){

.number{
    font-size:30px;
}

.label{
    font-size:16px;
}

.profile{
    width:220px;
    height:220px;
}
}
</style>
</head>
<body>

<img src="https://www.image2url.com/r2/default/images/1780107983571-58e14584-069e-4528-8699-12a725cbc613.png" class="profile">

<a href="https://t.me/+Y_ddWZ_naBtlMTE9" class="join-btn">
    ✈️ Join Telegram ✈️
</a>

<div class="banner">
    INDIA <span>NO.1.</span>CHANNEL
</div>

<div class="timer">

    <div class="box">
        <div class="number" id="days">00</div>
        <div class="label">DAYS</div>
    </div>

    <div class="box">
        <div class="number" id="hours">00</div>
        <div class="label">HOURS</div>
    </div>

    <div class="box">
        <div class="number" id="minutes">01</div>
        <div class="label">MINUTES</div>
    </div>

    <div class="box">
        <div class="number" id="seconds">60</div>
        <div class="label">SECONDS</div>
    </div>

</div>

<script>

let countDownDate = new Date().getTime() + (60 * 1000);

setInterval(function(){

let now = new Date().getTime();
let distance = countDownDate - now;

let days = Math.floor(distance / (1000 * 60 * 60 * 24));
let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
let seconds = Math.floor((distance % (1000 * 60)) / 1000);

document.getElementById("days").innerHTML = String(days).padStart(2,'0');
document.getElementById("hours").innerHTML = String(hours).padStart(2,'0');
document.getElementById("minutes").innerHTML = String(minutes).padStart(2,'0');
document.getElementById("seconds").innerHTML = String(seconds).padStart(2,'0');

},1000);

</script>

</body>
</html>
