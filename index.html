<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landing Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(to bottom,#020811,#00050c);
      padding:20px;
    }

    .wrapper{
      width:100%;
      max-width:390px;
      text-align:center;
    }

    .card{
      background:#07111d;
      border:1px solid rgba(255,255,255,.05);
      border-radius:28px;
      padding:38px 24px;
      box-shadow:0 0 25px rgba(0,0,0,.4);
    }

    h1{
      font-size:34px;
      font-weight:800;
      color:#16a3ff;
      margin-bottom:14px;
      letter-spacing:1px;
      font-family:Georgia,serif;
    }

    .sub{
      color:#b9c1cb;
      font-size:15px;
      margin-bottom:28px;
    }

    .btn{
      display:block;
      width:100%;
      text-decoration:none;
      background:#ff1313;
      color:white;
      font-weight:700;
      font-size:16px;
      padding:22px;
      border-radius:22px;
      margin-bottom:18px;
      box-shadow:0 0 35px rgba(255,0,0,.45);
      transition:.25s;
    }

    .btn:hover{
      transform:scale(1.02);
    }

    .credit{
      color:#ff4949;
      margin-top:26px;
      font-size:17px;
      font-weight:600;
    }
  </style>
</head>
<body>

  <div class="wrapper">

    <div class="card">
      <h1>𝐀𝐒𝐇𝐈𝐒𝐇 ~ 𝐀𝐑𝐌𝐘 ❤️</h1>
      <p class="sub">Tap to join the Telegram channel</p>

      <a href="https://t.me/+4rPpUEOQvb9jOTA9" class="btn">JOIN TELEGRAM CHANNEL</a>
      <a href="https://t.me/+4rPpUEOQvb9jOTA9" class="btn">JOIN TELEGRAM CHANNEL</a>
    </div>

    <div class="credit">
      Ad setup by @tengenadsagency
    </div>

  </div>

</body>
</html>
