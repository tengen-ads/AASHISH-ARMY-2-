<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>𝐀𝐒𝐇𝐈𝐒𝐇 ~ 𝐀𝐑𝐌𝐘 </title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      width:100%;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg,#06005f,#000000);
      padding:20px;
    }

    .card{
      width:100%;
      max-width:370px;
      background:#04003d;
      border-radius:30px;
      padding:35px 25px;
      text-align:center;
      box-shadow:0 0 30px rgba(0,0,0,0.5);
    }

    .profile{
      width:140px;
      height:140px;
      border-radius:50%;
      margin:auto;
      padding:4px;
      background:#00bfff;
      box-shadow:0 0 20px #00bfff;
    }

    .profile img{
      width:100%;
      height:100%;
      border-radius:50%;
      object-fit:cover;
    }

    h1{
      color:#00bfff;
      font-size:32px;
      margin-top:25px;
      font-weight:800;
      line-height:1.2;
    }

    p{
      color:#ffffff;
      margin-top:20px;
      font-size:18px;
    }

    .btn{
      display:block;
      width:100%;
      background:#ff1111;
      color:white;
      text-decoration:none;
      padding:22px;
      margin-top:28px;
      border-radius:22px;
      font-size:20px;
      font-weight:bold;
      box-shadow:0 0 20px rgba(255,0,0,0.6);
      transition:0.3s;
    }

    .btn:hover{
      transform:scale(1.03);
    }

    .footer{
      margin-top:30px;
      color:#ff2a2a;
      font-size:16px;
    }

    .footer a{
      color:#ff2a2a;
    }

    @media(max-width:480px){

      h1{
        font-size:26px;
      }

      .btn{
        font-size:18px;
        padding:20px;
      }

      p{
        font-size:16px;
      }
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="profile">
      <!-- Yaha apni image ka naam dalo -->
      <img src="https://www.image2url.com/r2/default/images/1778895121774-b2cc91b7-8e89-4792-997d-f67742215259.jpg" alt="">
    </div>

    <h1>𝐀𝐒𝐇𝐈𝐒𝐇 ~ 𝐀𝐑𝐌𝐘</h1>

    <p>Tap to join the Telegram channel</p>

    <!-- Yaha Telegram ya Channel Link dalo -->
    <a href="https://t.me/+4rPpUEOQvb9jOTA9" class="btn">
      JOIN TELEGRAM CHANNEL
    </a>

    <a href="https://t.me/+4rPpUEOQvb9jOTA9" class="btn">
      JOIN TELEGRAM CHANNEL
    </a>

    <div class="footer">
      Ads setup by <a href="#">TENGENADSAGENCY</a>
    </div>

  </div>

</body>
</html>
